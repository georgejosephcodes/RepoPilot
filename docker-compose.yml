services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repopilot}
      POSTGRES_DB: ${POSTGRES_DB:-repopilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first init of an empty data volume.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repopilot} -d ${POSTGRES_DB:-repopilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
