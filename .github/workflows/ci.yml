name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot
          POSTGRES_DB: repopilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repopilot -d repopilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://repopilot:repopilot@localhost:5432/repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Apply migrations
        run: for f in migrations/*.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        working-directory: api
        run: go vet ./...
      - name: go test
        working-directory: api
        run: go test -race -count=1 ./...

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot
          POSTGRES_DB: repopilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repopilot -d repopilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # the worker tests create and drop their own database on this server
      TEST_DATABASE_URL: postgres://repopilot:repopilot@localhost:5432/repopilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Install
        working-directory: worker
        run: pip install -r requirements.txt
      - name: pytest
        working-directory: worker
        run: pytest -q
